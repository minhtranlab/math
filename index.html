<!--
  Math Skill Bank — nice link (copied from SAT Math Lib #39). iPad: Safari → Share → Add to Home Screen opens it full screen
  (manifest.webmanifest + apple tags + icons, #9 v2). This page only shows the Apps Script web app full screen.
  The app, its data and every rule stay on the Apps Script side; the script.google.com link keeps working.
  Students and the teacher sign in on the same screen. noindex: search engines do not list it. LIGHT ONLY.
  Source: site/ on main; published to the gh-pages branch by tools/publish_site.sh.
-->
<style>
  :root { color-scheme: light only; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ffffff; }
  body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #191c26; }
  #wait { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  #wait p { margin: 0 0 8px; }
  #wait a { color: #0f766e; }
  #wait .muted { color: #5f6577; font-size: 14px; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; visibility: hidden; background: #ffffff; }
  #app.on { visibility: visible; }
</style>
</head>
<body>
<div id="wait">
  <div>
    <p><b>Math Skill Bank</b> is loading…</p>
    <p class="muted" id="slow" hidden>Taking long? <a id="direct" href="#" rel="noopener">Open Math Skill Bank directly</a></p>
  </div>
</div>
<iframe id="app" title="Math Skill Bank" allow="clipboard-read; clipboard-write; fullscreen; web-share"></iframe>
<script>
  (function () {
    var APP_URL = 'https://script.google.com/macros/s/AKfycbzoYJ8e0oE7iE9vM4P9cuHGk4j8jbepHcVXdUIHltdt2IadYDDW6ZjNH60Vy2PZPE5e/exec';
    var f = document.getElementById('app');
    document.getElementById('direct').href = APP_URL;
    f.addEventListener('load', function () { f.className = 'on'; try { f.focus(); } catch (e) {} });
    setTimeout(function () { document.getElementById('slow').hidden = false; }, 12000);
    f.src = APP_URL;
  })();
</script>
<noscript><p style="padding:16px">Math Skill Bank needs JavaScript. <a href="https://script.google.com/macros/s/AKfycbzoYJ8e0oE7iE9vM4P9cuHGk4j8jbepHcVXdUIHltdt2IadYDDW6ZjNH60Vy2PZPE5e/exec">Open Math Skill Bank</a></p></noscript>
</body>
</html>
