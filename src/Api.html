<script>
/* ===================== api.js — the ONE place the browser talks to the server =====================
   Every call goes through API.* (Promise based). Nothing else in the page uses google.script.run
   (tests/structure_test.js checks it), so a later move to another backend changes only this file.
   Reads are retried once on a network error; writes (submitTry, useHint, nextQuestion) are never retried
   automatically (a lost answer is shown on screen and the student presses again). */
var API = (function () {
  function run(fn, args) {
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e || new Error('Network error')); });
      r[fn].apply(r, args);
    });
  }
  function isNet(e) { var m = String((e && e.message) || e || ''); return !/^(LOGIN|SESSION)/.test(m); }
  function read(fn, args) { return run(fn, args).catch(function (e) { if (!isNet(e)) throw e; return new Promise(function (ok) { setTimeout(ok, 800); }).then(function () { return run(fn, args); }); }); }
  /** SAT Math Lib #43: the encoded answer spec of the ONE open question (salt = attempt|qid). Obfuscation only. */
  function decodeKey(hex, salt) {
    try {
      var t = '', i; salt = String(salt || 'msb');
      for (i = 0; i < hex.length / 2; i++) t += String.fromCharCode((parseInt(hex.substr(2 * i, 2), 16) ^ salt.charCodeAt(i % salt.length) ^ (37 + i * 11) % 251) & 255);
      return JSON.parse(decodeURIComponent(escape(t)));
    } catch (e) { return null; }
  }
  /** Message for the student from a server error ("LOGIN: …" → the text after the colon). */
  function msg(e) { var m = String((e && e.message) || e || ''); return /^(LOGIN|SESSION): /.test(m) ? m.replace(/^\w+: /, '') : 'No connection. Check the internet and try again.'; }
  return {
    login: function (code, device, withHome) { return read('login', [code, device, withHome]); },
    homeData: function (code) { return read('homeData', [code]); },
    mySkills: function (code) { return read('mySkills', [code]); },
    reviewList: function (code) { return read('reviewList', [code]); },
    nextQuestion: function (code, opts) { return run('nextQuestion', [code, opts || {}]); },
    submitTry: function (code, attemptId, answer, sec, clientSaid) { return run('submitTry', [code, attemptId, answer, sec, clientSaid]); },
    useHint: function (code, attemptId) { return run('useHint', [code, attemptId]); },
    teacherHome: function (code, fresh) { return read('teacherHome', [code, !!fresh]); },
    teacherPathData: function (code, fresh) { return read('teacherPathData', [code, !!fresh]); },
    teacherSetPath: function (code, student, subIds) { return run('teacherSetPath', [code, student, subIds]); },
    teacherGrid: function (code, fresh) { return read('teacherGrid', [code, !!fresh]); },
    teacherCell: function (code, student, sub, fresh) { return read('teacherCell', [code, student, sub, !!fresh]); },
    liveTyping: function (code, attemptId, typed) { return run('liveTyping', [code, attemptId, typed]); },
    tsHome: function (code, fresh) { return read('tsHome', [code, !!fresh]); },
    tsStart: function (code, student, subIds, level, beginSub, beginQid) { return run('tsStart', [code, student, subIds, level, beginSub || '', beginQid || '']); },
    tsClose: function (code, sid) { return run('tsClose', [code, sid]); },
    tsLive: function (code, student) { return read('tsLive', [code, student]); },
    tsCandidates: function (code, student, sub, level) { return read('tsCandidates', [code, student, sub, level]); },
    tsAssignNext: function (code, student, qid) { return run('tsAssignNext', [code, student, qid]); },
    teacherSetLevel: function (code, student, sub, setTo) { return run('teacherSetLevel', [code, student, sub, setTo]); },
    hwStart: function (code, aid, device) { return run('hwStart', [code, aid, device || '']); },
    hwGet: function (code, setId, device) { return run('hwGet', [code, setId, device || '']); },
    hwSave: function (code, setId, payload) { return run('hwSave', [code, setId, payload]); },
    hwSubmit: function (code, setId, payload) { return run('hwSubmit', [code, setId, payload]); },
    hwResult: function (code, setId) { return read('hwResult', [code, setId]); },
    hwFix: function (code, setId) { return read('hwFix', [code, setId]); },
    hwFixKey: function (code, setId, qid) { return read('hwFixKey', [code, setId, qid]); },
    hwFixTry: function (code, setId, qid, answer, sec, clientSaid) { return run('hwFixTry', [code, setId, qid, answer, sec, clientSaid]); },
    hwHistory: function (code) { return read('hwHistory', [code]); },
    hwReview: function (code, setId) { return read('hwReview', [code, setId]); },
    askTeacher: function (code, ref, on, note) { return run('askTeacher', [code, ref, !!on, note || '']); },
    hwBuilder: function (code, target, fresh) { return read('hwBuilder', [code, target || '', !!fresh]); },
    hwPick: function (code, spec) { return read('hwPick', [code, spec]); },
    hwPublish: function (code, a) { return run('hwPublish', [code, a]); },
    hwList: function (code, fresh) { return read('hwList', [code, !!fresh]); },
    hwSetStatus: function (code, aid, action) { return run('hwSetStatus', [code, aid, action]); },
    asksInbox: function (code, fresh) { return read('asksInbox', [code, !!fresh]); },
    resolveAsk: function (code, askId, reopen) { return run('resolveAsk', [code, askId, !!reopen]); },
    goOver: function (code, target, scope, fresh) { return read('goOver', [code, target || '', scope || '', !!fresh]); },
    goQuestion: function (code, qid) { return read('goQuestion', [code, qid]); },
    tagMistake: function (code, ref, type, note, undoAsk) { return run('tagMistake', [code, ref, type || '', note === undefined ? null : note, !!undoAsk]); },
    decodeKey: decodeKey, msg: msg
  };
})();
</script>
