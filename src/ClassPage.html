<script>
/* ===================== MSB — teacher Class mode (ticket #9) =====================
   Start a session (one student or a group) → live panel (refreshes every few seconds while this tab is open):
   per student question, what they have typed / chosen now, tries, Hint, time, state; controls Pause / Continue / Message /
   Show answer / Push next / Open on my screen; next-questions queue (add from any sub-skill, ↑ ↓, E/M/H, Swap, ✕, push).
   End class → the session result (resultTable, the ONE result view). Labels only (lesson 14). */
var CL = { sid: '', timer: 0, live: null, qsig: '' };
var STATE_TXT = { waiting: 'Waiting', working: 'Working', right: 'Right', wrong: 'Wrong', revealed: 'Answer shown' };
function clStop() { if (CL.timer) clearTimeout(CL.timer); CL.timer = 0; }
function clFail(e) { var m = $('#cl-msg'); if (m) m.textContent = API.msg(e); else $('#t-main').innerHTML = tabsBar() + '<p class="err">' + esc(API.msg(e)) + '</p>'; }

function openClassTab(fresh) {
  clStop();
  if (CL.sid) { API.classLive(S.teacher, CL.sid).then(renderLive).catch(clFail); return; }
  API.classHome(S.teacher, fresh).then(renderClassHome).catch(clFail);
}
function renderClassHome(d) {
  if (d.open && !CL.home) { CL.home = 1; CL.sid = d.open; openClassTab(false); return; }
  var h = tbar('Class', 'Updated ' + esc(d.read_at));
  h += '<div class="pills" id="cl-pick">' + d.students.map(function (s) { return '<button type="button" class="pill" data-pick="' + esc(s.code) + '">' + esc(s.name) + '</button>'; }).join('') + '</div>';
  h += '<div class="addq"><input class="field" id="cl-title" placeholder="Title" style="max-width:320px;text-transform:none;letter-spacing:0;padding:10px 16px;font-size:16px">' +
       '<button class="btn big" id="cl-start" type="button">Start class</button><span class="stamp" id="cl-msg"></span></div>';
  if (d.sessions.length) h += '<h2 class="h2">Sessions</h2>' + tTable([
    ['Started', function (s) { return esc(s.started); }], ['Title', function (s) { return esc(s.title); }], ['Students', function (s) { return esc(s.students); }],
    ['', function (s) { return '<button type="button" class="mini" data-sess="' + esc(s.session_id) + '" data-st="' + esc(s.status) + '">' + (s.status === 'open' ? 'Open' : 'Summary') + '</button>'; }]
  ], d.sessions, '');
  $('#t-main').innerHTML = h;
}

function renderLive(d) {
  CL.live = d; CL.sid = d.session_id;
  if (d.status !== 'open') { showClassResult(d.session_id); return; }
  if (!$('#cl-live')) {
    CL.qsig = '';
    var names = d.students.map(function (s) { return '<option value="' + esc(s.code) + '">' + esc(s.name) + '</option>'; }).join('');
    $('#t-main').innerHTML = tbar('Class · ' + esc(d.title), '<span id="cl-stamp"></span>') +
      '<div class="addq"><span>Tries</span><button type="button" class="mini" data-tries="-1">−</button><b id="cl-tries"></b><button type="button" class="mini" data-tries="1">+</button>' +
      '<button type="button" class="btn small" data-push="*">Push next to all</button><button type="button" class="btn ghost small" data-ctl="pause" data-to="*">Pause all</button>' +
      '<button type="button" class="btn ghost small" data-ctl="continue" data-to="*">Continue all</button><button type="button" class="btn ghost small" id="cl-end">End class</button></div>' +
      '<div class="addq"><input class="field" id="cl-text" placeholder="Message or hint" style="max-width:420px;text-transform:none;letter-spacing:0;padding:9px 16px;font-size:16px">' +
      '<select id="cl-to"><option value="*">Everyone</option>' + names + '</select><button type="button" class="btn small" id="cl-send">Send</button><span class="stamp" id="cl-msg"></span></div>' +
      '<div class="cls-cols"><div><h2 class="h2">Live</h2><div id="cl-live"></div></div><div><h2 class="h2">Next questions</h2><div id="cl-queue"></div>' +
      '<div class="addq"><select id="cl-sub">' + d.subs.map(function (u) { return '<option value="' + esc(u.id) + '">' + esc(u.name) + ' (' + u.n.E + '/' + u.n.M + '/' + u.n.H + ')</option>'; }).join('') + '</select>' +
      '<select id="cl-diff"><option>E</option><option>M</option><option>H</option></select><button type="button" class="btn small" id="cl-add">Add</button></div></div></div>';
  }
  $('#cl-stamp').textContent = 'Updated ' + d.read_at;
  var rb = $('#t-refresh'); if (rb) { rb.disabled = false; rb.textContent = 'Refresh'; }
  $('#cl-tries').textContent = d.max_tries;
  if (d.msg) $('#cl-msg').textContent = d.msg;
  $('#cl-live').innerHTML = tTable([
    ['Student', function (s) { return '<b>' + esc(s.name) + '</b>' + (s.paused ? ' <span class="chip pr">Paused</span>' : ''); }],
    ['Question', function (s) { return s.qid ? esc(s.qid) + ' <span class="muted">' + esc(s.difficulty) + '</span><br><span class="muted" style="font-size:13px">' + esc(s.subskill) + '</span>' : '—'; }],
    ['Now', function (s) { return s.typed ? '<span class="typed">' + esc(s.typed) + '</span>' : ''; }],
    ['Tries', function (s) { return (s.tries || []).map(function (t) { return '<span class="' + (t.ok ? 'ok-t' : 'no-t') + '">' + (t.ok ? '✓ ' : '✗ ') + esc(t.a) + '</span>'; }).join(' · '); }],
    ['Hint', function (s) { return s.hint ? 'Yes' : ''; }],
    ['Time', function (s) { return s.qid ? Math.floor(s.sec / 60) + ':' + ('0' + s.sec % 60).slice(-2) : ''; }, 1],
    ['', function (s) { return '<span class="st-' + s.state + '">' + STATE_TXT[s.state] + '</span>' + (s.helped ? ' <span class="muted">helped</span>' : ''); }],
    ['', function (s) {
      return '<span class="acts" style="display:flex;gap:4px;flex-wrap:wrap">' +
        (s.paused ? '<button type="button" class="mini on" data-ctl="continue" data-to="' + esc(s.code) + '">Continue</button>' : '<button type="button" class="mini" data-ctl="pause" data-to="' + esc(s.code) + '">Pause</button>') +
        '<button type="button" class="mini" data-ctl="reveal" data-to="' + esc(s.code) + '"' + (s.state === 'working' ? '' : ' disabled') + '>Show answer</button>' +
        '<button type="button" class="mini" data-push="' + esc(s.code) + '">Push next</button>' +
        (s.qid ? '<button type="button" class="mini" data-open="' + esc(s.qid) + '">Open</button>' : '') + '</span>';
    }]
  ], d.students, '');
  var sig = JSON.stringify(d.queue);
  if (sig !== CL.qsig) {
    CL.qsig = sig;
    var queued = d.queue.filter(function (q) { return q.status === 'queued'; }), pushed = d.queue.filter(function (q) { return q.status !== 'queued'; });
    $('#cl-queue').innerHTML = (queued.length ? '' : '<p class="empty">Empty — add questions below.</p>') + queued.map(function (q, i) {
      return '<div class="qrow"><b>' + (i + 1) + '</b><span>' + esc(q.qid) + ' <span class="muted">' + esc(q.subskill_name) + '</span></span><span class="acts">' +
        ['E', 'M', 'H'].map(function (L) { return '<button type="button" class="mini' + (q.difficulty === L ? ' on' : '') + '" data-q="level" data-item="' + esc(q.item_id) + '" data-d="' + L + '">' + L + '</button>'; }).join('') +
        '<button type="button" class="mini" data-q="up" data-item="' + esc(q.item_id) + '"' + (i ? '' : ' disabled') + '>↑</button><button type="button" class="mini" data-q="down" data-item="' + esc(q.item_id) + '"' + (i < queued.length - 1 ? '' : ' disabled') + '>↓</button>' +
        '<button type="button" class="mini" data-q="swap" data-item="' + esc(q.item_id) + '">Swap</button><button type="button" class="mini" data-q="remove" data-item="' + esc(q.item_id) + '">✕</button>' +
        '<button type="button" class="mini" data-open="' + esc(q.qid) + '">Open</button></span></div>';
    }).join('') + pushed.slice(-5).map(function (q) { return '<div class="qrow pushed"><b>·</b><span>' + esc(q.qid) + ' <span class="muted">' + esc(q.subskill_name) + ' · pushed to ' + esc(q.pushed_to) + '</span></span><span></span></div>'; }).join('');
  }
  clSchedule();
}
function clSchedule() {
  clStop();
  CL.timer = setTimeout(function () {
    if (T.tab !== 'class' || !CL.sid || !$('#scr-teacher').classList.contains('on')) return;
    API.classLive(S.teacher, CL.sid).then(renderLive).catch(function () { clSchedule(); });
  }, ((CL.live && CL.live.poll_sec) || 3) * 1000);
}
function clDo(p) { clStop(); var m = $('#cl-msg'); if (m) m.textContent = ''; return p.then(renderLive).catch(function (e) { clFail(e); clSchedule(); }); }

function showClassResult(sid) {
  clStop();
  API.classSummary(S.teacher, sid).then(function (d) {
    var sm = d.summary; CL.sid = ''; CL.live = null; CL.qsig = '';
    $('#t-main').innerHTML = tabsBar() + '<div class="tbar"><h2 class="h2" style="margin:0">Class session · ' + esc(sm.title) + '</h2><span class="stamp">' + esc(sm.started) + (sm.ended ? ' – ' + esc(sm.ended) : '') + '</span>' +
      '<button type="button" class="btn ghost small" id="cl-back">All sessions</button></div>' + resultTable(sm, true);
  }).catch(clFail);
}

/* ---------- Open on my screen: the question + the correct answer + pen + notes (copied SML go-over tools) ---------- */
function openTeacherQuestion(qid) {
  clStop();
  API.classTeacherQuestion(S.teacher, qid).then(function (d) {
    show('scr-tq'); penSet(false);
    $('#tq-sub').textContent = d.subskill; $('#tq-qid').textContent = d.q.qid;
    var q = d.q, h = '<div class="stem">' + q.stem_html + '</div>';
    if (q.type === 'mcq') h += '<div class="choices">' + q.choices.map(function (c) { return '<div class="ch" data-l="' + esc(c.label) + '"><span class="lt">' + esc(c.label) + '</span><span>' + c.html + '</span></div>'; }).join('') + '</div>';
    h += '<div class="ansbox hidden" id="tq-answer"><div class="fb ans">Answer: ' + (d.answer.label ? '<b>' + esc(d.answer.label) + '</b> ' : '') + d.answer.html + '</div>' +
         (d.hint_html ? '<div class="hint"><span class="lab">Hint</span>' + d.hint_html + '</div>' : '') + '</div>';
    $('#tq-card').innerHTML = h; CL.tqAns = d.answer.label;
    $('#tq-ans').textContent = 'Show answer';
    penAttach($('#tq-card')); typeset($('#tq-card'));
    setTimeout(penSize, 400);
  }).catch(clFail);
}
document.addEventListener('click', function (ev) {
  if (ev.target.closest('#tq-pen')) { penSet(!PEN.on); return; }
  if (ev.target.closest('#tq-notes')) { $('#tq-notepad').classList.toggle('hidden'); $('#tq-notes').classList.toggle('on'); return; }
  if (ev.target.closest('#tq-ans')) {
    var a = $('#tq-answer'), on = a.classList.toggle('hidden');
    $('#tq-ans').textContent = on ? 'Show answer' : 'Hide answer';
    $$('#tq-card .ch').forEach(function (c) { c.classList.toggle('right', !on && c.getAttribute('data-l') === CL.tqAns); });
    penSize(); return;
  }
  if (ev.target.closest('#tq-close')) { penSet(false); penDetach(); show('scr-teacher'); if (T.tab === 'class') openClassTab(false); }
});

$('#t-main').addEventListener('click', function (ev) {
  if (T.tab !== 'class') return;
  var t;
  if ((t = ev.target.closest('[data-pick]'))) { t.classList.toggle('on'); return; }
  if (ev.target.closest('#cl-start')) {
    var codes = $$('#cl-pick .pill.on').map(function (b) { return b.getAttribute('data-pick'); });
    if (!codes.length) { $('#cl-msg').textContent = 'Pick at least one student.'; return; }
    ev.target.closest('#cl-start').disabled = true;
    API.classStart(S.teacher, codes, $('#cl-title').value).then(function (d) { CL.qsig = ''; renderLive(d); }).catch(clFail); return;
  }
  if ((t = ev.target.closest('[data-sess]'))) { CL.qsig = ''; if (t.getAttribute('data-st') === 'open') { CL.sid = t.getAttribute('data-sess'); openClassTab(false); } else showClassResult(t.getAttribute('data-sess')); return; }
  if (ev.target.closest('#cl-back')) { CL.sid = ''; CL.home = 1; openClassTab(true); return; }
  if (!CL.sid) return;
  if ((t = ev.target.closest('[data-push]'))) { clDo(API.classPush(S.teacher, CL.sid, t.getAttribute('data-push'))); return; }
  if ((t = ev.target.closest('[data-ctl]'))) { t.disabled = true; clDo(API.classControl(S.teacher, CL.sid, t.getAttribute('data-to'), t.getAttribute('data-ctl'))); return; }
  if ((t = ev.target.closest('[data-tries]'))) { clDo(API.classControl(S.teacher, CL.sid, '*', 'tries', (CL.live.max_tries || 3) + Number(t.getAttribute('data-tries')))); return; }
  if (ev.target.closest('#cl-send')) {
    var txt = $('#cl-text').value.trim(); if (!txt) { $('#cl-msg').textContent = 'Type a message first.'; return; }
    clDo(API.classControl(S.teacher, CL.sid, $('#cl-to').value, 'message', txt).then(function (d) { $('#cl-text').value = ''; d.msg = 'Sent'; return d; })); return;
  }
  if (ev.target.closest('#cl-add')) { clDo(API.classQueueEdit(S.teacher, CL.sid, 'add', { subskill: $('#cl-sub').value, difficulty: $('#cl-diff').value })); return; }
  if ((t = ev.target.closest('[data-q]'))) { clDo(API.classQueueEdit(S.teacher, CL.sid, t.getAttribute('data-q'), { item_id: t.getAttribute('data-item'), difficulty: t.getAttribute('data-d') })); return; }
  if ((t = ev.target.closest('[data-open]'))) { openTeacherQuestion(t.getAttribute('data-open')); return; }
  if (ev.target.closest('#cl-end')) { clStop(); API.classEnd(S.teacher, CL.sid).then(function () { showClassResult(CL.sid); }).catch(clFail); return; }
});
</script>
