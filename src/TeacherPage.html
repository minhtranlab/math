<script>
/* ===================== MSB — teacher page (skeleton, ticket #4) =====================
   One overview: students · wrong twice (to explain) · hint use · recent answers. "Refresh" reads the Sheet itself
   (SAT lesson #4: snapshots make teacher views stale). Assign path + status grid come in the next ticket. */
var RES_TEXT = { right_1: 'Right 1st try', right_2: 'Right 2nd try', wrong_2: 'Wrong twice' };
function openTeacher(fresh) {
  if (!S.teacher) { show('scr-login'); return; }
  show('scr-teacher');
  var m = $('#t-main');
  if (!m.querySelector('.tbar')) m.innerHTML = '<div class="spinner"></div>';
  else { var b = $('#t-refresh'); if (b) { b.disabled = true; b.textContent = 'Refreshing…'; } }
  API.teacherHome(S.teacher, fresh).then(renderTeacher).catch(function (e) { m.innerHTML = '<p class="err">' + esc(API.msg(e)) + '</p><button class="btn" id="t-refresh" type="button">Refresh</button>'; });
}
function tTable(cols, rows, empty) {
  if (!rows.length) return '<p class="empty">' + empty + '</p>';
  return '<div class="tscroll"><table class="tbl"><thead><tr>' + cols.map(function (c) { return '<th' + (c[2] ? ' class="r"' : '') + '>' + c[0] + '</th>'; }).join('') + '</tr></thead><tbody>' +
    rows.map(function (r) { return '<tr>' + cols.map(function (c) { return '<td' + (c[2] ? ' class="r"' : '') + '>' + c[1](r) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
}
function renderTeacher(d) {
  var h = '<div class="tbar"><h2 class="h2" style="margin:0">Overview</h2><button class="btn ghost small" id="t-refresh" type="button">Refresh</button>' +
          '<span class="stamp">Updated ' + esc(d.read_at) + ' · ' + d.n_live + ' live questions · ' + d.n_subskills + ' sub-skills</span></div>';
  h += '<h2 class="h2">Students</h2>' + tTable([
    ['Name', function (s) { return esc(s.name) + (s.active ? '' : ' <span class="muted">(locked)</span>'); }],
    ['Path', function (s) { return s.path_n ? s.path_n + ' tick' + (s.path_n === 1 ? '' : 's') : '<span class="muted">none</span>'; }, 1],
    ['Done', function (s) { return s.done; }, 1], ['Right 1st try', function (s) { return s.right1; }, 1],
    ['Wrong twice', function (s) { return s.wrong2; }, 1], ['Hints', function (s) { return s.hints; }, 1],
    ['Last', function (s) { return esc(s.last); }]
  ], d.students, 'No students yet — add rows to the Students tab.');
  h += '<h2 class="h2">Wrong twice — to explain</h2>' + tTable([
    ['Student', function (r) { return esc(r.student); }], ['Sub-skill', function (r) { return esc(r.subskill); }],
    ['Question', function (r) { return esc(r.qid); }], ['Added', function (r) { return esc(r.added); }]
  ], d.wrong2, 'Nothing to explain.');
  h += '<h2 class="h2">Hint use</h2>' + tTable([
    ['Student', function (r) { return esc(r.student); }], ['Sub-skill', function (r) { return esc(r.subskill); }], ['Hints', function (r) { return r.n; }, 1]
  ], d.hints, 'No hints used yet.');
  h += '<h2 class="h2">Recent answers</h2>' + tTable([
    ['When', function (r) { return esc(r.when); }], ['Student', function (r) { return esc(r.student); }], ['Sub-skill', function (r) { return esc(r.subskill); }],
    ['Question', function (r) { return esc(r.qid) + ' <span class="muted">' + esc(r.difficulty) + '</span>'; }],
    ['Result', function (r) { return '<span class="res-' + esc(r.result) + '">' + esc(RES_TEXT[r.result] || r.result) + '</span>'; }],
    ['Hint', function (r) { return r.hint ? 'Yes' : ''; }], ['Time', function (r) { return r.time ? r.time + ' s' + (r.pace === 'slow' ? ' <span class="muted">slow</span>' : '') : ''; }, 1],
    ['Step', function (r) { return r.step === '' ? '' : r.step; }, 1]
  ], d.recent, 'No answers yet.');
  $('#t-main').innerHTML = h;
}
$('#t-main').addEventListener('click', function (ev) { if (ev.target.closest('#t-refresh')) openTeacher(true); });
</script>
