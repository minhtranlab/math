<script>
/* ===================== MSB — student screens: sign-in, home (my path, review list), one question =====================
   Talks to the server only through API (Api.html). Grading for the instant ✓/✗ = msbGrade_ (Grade.gs, the server's own
   function sent as text); the server re-grades every try and its answer wins (mismatch → the screen follows the server). */
var S = { code: '', name: '', teacher: '', home: null, cur: null, spec: null, sel: '', shownAt: 0, busy: false, scope: {} };
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function show(id) {
  $$('.screen').forEach(function (s) { s.classList.toggle('on', s.id === id); }); window.scrollTo(0, 0);
  if (id !== 'scr-q' && id !== 'scr-tq' && typeof toolsOff === 'function') toolsOff();
}
function typeset(el) { try { if (window.MathJax && MathJax.typesetPromise) MathJax.startup.promise.then(function () { return MathJax.typesetPromise([el]); }); } catch (e) {} }
function store(k, v) { try { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
function stored(k) { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } }
function deviceId() {
  var d = ''; try { d = localStorage.getItem('msb_dev') || ''; if (!d) { d = 'd' + Math.random().toString(36).slice(2, 12); localStorage.setItem('msb_dev', d); } } catch (e) { d = 'nostore'; }
  return d;
}

/* ---------------- sign-in ---------------- */
$('#login-form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var code = $('#login-code').value.trim().toUpperCase(), err = $('#login-err'), btn = $('#login-btn');
  if (!code) { err.textContent = 'Type your code.'; return; }
  err.textContent = ''; btn.disabled = true;
  API.login(code, deviceId(), true).then(function (r) {
    btn.disabled = false;
    if (!r.ok) { err.textContent = r.msg || 'Code not found.'; return; }
    $('#login-code').value = '';
    if (r.teacher) { S.teacher = code; location.hash = 'teacher'; openTeacher(false); return; }   // teacher code: memory only
    S.code = r.student.code; S.name = r.student.name; store('msb_code', S.code);
    renderHome(r.home);
  }).catch(function (e) { btn.disabled = false; err.textContent = API.msg(e); });
});
function logout() { S = { code: '', name: '', teacher: '', home: null, cur: null, spec: null, sel: '', scope: {} }; store('msb_code', null); location.hash = ''; show('scr-login'); }
document.addEventListener('click', function (ev) {
  var go = ev.target.closest('[data-go]'), act = ev.target.closest('[data-act]');
  if (act && act.getAttribute('data-act') === 'logout') { logout(); return; }
  if (!go) return;
  var g = go.getAttribute('data-go');
  if (g === 'home') goHome(); else if (g === 'skills') openSkills(); else if (g === 'teacher' && S.teacher) openTeacher(false);
});

/* ---------------- home ---------------- */
function goHome() {
  if (!S.code) { show('scr-login'); return; }
  location.hash = 'home';
  show('scr-home'); $('#home-list').innerHTML = '<div class="spinner"></div>';
  API.homeData(S.code).then(renderHome).catch(function (e) { $('#home-list').innerHTML = '<p class="err">' + esc(API.msg(e)) + '</p>'; });
}
var LVN = { E: 'Easy', M: 'Medium', H: 'Hard' };
function half(n) { var w = Math.floor(n), h = n - w >= 0.5; return (w || !h ? w : '') + (h ? '½' : ''); }
function chipOf(p) {
  if (p.solid) return '<span class="chip so">Solid</span>';
  if (p.status === 'not started') return '<span class="chip ns">Not started</span>';
  return '<span class="chip pr">' + LVN[p.level] + ' · ' + half(p.steps) + '/' + p.need + '</span>';
}
function ladder(pos) {
  var h = '<span class="lad" aria-label="' + pos + ' of 9">';
  ['E', 'M', 'H'].forEach(function (L, g) {
    h += '<span class="lg"><i class="ll">' + L + '</i>';
    for (var i = 0; i < 3; i++) { var k = 3 * g + i, c = pos >= k + 1 ? 'f' : pos >= k + 0.5 ? 'h' : ''; h += '<b class="' + c + '"></b>'; }
    h += '</span>';
  });
  return h + '<span class="ls' + (pos >= 9 ? ' on' : '') + '">Solid</span></span>';
}
function renderHome(h) {
  if (!h) { goHome(); return; }
  S.home = h; location.hash = 'home'; show('scr-home');
  $('#home-name').textContent = S.name;
  $('#home-hello').textContent = 'Hi ' + (S.name.split(' ')[0] || '') + '!';
  var out = '';
  if (h.teacher_open) out += '<div class="card tcard"><div><p class="eyebrow">Practise with teacher</p><h3>' + esc(h.teacher_open.next_name || 'All solid') + '</h3>' +
                             '<p class="sub">' + h.teacher_open.solid + ' of ' + h.teacher_open.n + ' sub-skill' + (h.teacher_open.n === 1 ? '' : 's') + ' solid</p></div>' +
                             '<button class="btn big" type="button" data-start="teacher" data-sid="' + esc(h.teacher_open.session_id) + '">Start</button></div><div style="height:14px"></div>';
  if (h.path.length) {
    var nSolid = h.path.filter(function (p) { return p.solid; }).length;
    out += '<div class="card"><div><p class="eyebrow">My path · ' + nSolid + ' of ' + h.path.length + ' solid</p>' +
           '<h3>' + (h.next ? esc(h.next_name) : (nSolid === h.path.length ? 'All solid' : 'No questions yet')) + '</h3>' +
           '<p class="sub">' + h.n_done + ' question' + (h.n_done === 1 ? '' : 's') + ' done</p></div>' +
           '<div class="cta"><button class="btn big" type="button" data-start="path"' + (h.next ? '' : ' disabled') + '>Practise</button>' +
           '<button class="btn ghost" type="button" data-go="skills">My skills</button></div></div>';
    var by = {}; h.path.forEach(function (p) { (by[p.skill_id] = by[p.skill_id] || []).push(p); });
    h.skills.forEach(function (k) {
      out += '<div class="skill"><b>' + esc(k.name) + ' <span class="muted kn">' + k.solid + ' of ' + k.n + ' solid</span></b>' + by[k.id].map(function (p) {
        return '<div class="row"><span class="nm">' + esc(p.name) + '<span class="id">' + esc(p.id) + '</span></span>' +
               '<span>' + chipOf(p) + '</span><span class="n">' + p.n_done + ' done</span>' +
               (p.n_live ? '<button class="btn ghost small" type="button" data-start="sub" data-id="' + esc(p.id) + '">Practise</button>' : '<span class="muted" style="font-size:14px">No questions yet</span>') + '</div>';
      }).join('') + '</div>';
    });
  } else if (h.sample_n) {
    out += '<div class="card"><div><p class="eyebrow">Sample</p><h3>' + h.sample_n + ' sample question' + (h.sample_n === 1 ? '' : 's') + '</h3>' +
           '<p class="sub">' + h.n_done + ' done</p></div><button class="btn big" type="button" data-start="path">Start</button></div>';
  } else {
    out += '<p class="empty">Your teacher has not set your path yet.</p>';
  }
  out += '<h2 class="h2">Review list</h2>';
  if (h.review.length) {
    out += '<div class="card"><div><h3>' + h.review.length + ' to review</h3><p class="sub">' + h.review.slice(0, 4).map(function (r) { return esc(r.subskill); }).join(' · ') + '</p></div>' +
           '<button class="btn ghost big" type="button" data-start="review">Review</button></div>';
  } else out += '<p class="empty">Nothing to review.</p>';
  $('#home-list').innerHTML = out;
}

/* ---------------- My skills ---------------- */
function openSkills() {
  if (!S.code) { show('scr-login'); return; }
  location.hash = 'skills'; show('scr-skills'); $('#ms-list').innerHTML = '<div class="spinner"></div>';
  API.mySkills(S.code).then(function (d) {
    var h = '<div class="tbar"><h2 class="h2" style="margin:0">My skills</h2><span class="stamp">' + d.n_solid + ' of ' + d.n + ' solid' +
            (d.week_gain ? ' · <span class="gain">+' + half(d.week_gain) + ' this week</span>' : '') + '</span></div>';
    if (!d.n) h += '<p class="empty">Your teacher has not set your path yet.</p>';
    d.skills.forEach(function (k) {
      h += '<div class="skill"><b>' + esc(k.name) + ' <span class="muted kn">' + k.solid + ' of ' + k.n + ' solid</span></b>' + k.subs.map(function (x) {
        return '<div class="row ms"><span class="nm">' + esc(x.name) + '<span class="id">' + esc(x.id) + '</span></span>' + ladder(x.position) +
               '<span class="n">' + (x.ft_n ? x.ft_pct + '% first try <span class="muted">(' + x.ft_n + ')</span>' : '<span class="muted">—</span>') +
               (x.gain ? ' <span class="gain">+' + half(x.gain) + '</span>' : '') + '</span>' +
               (x.n_live ? '<button class="btn ghost small" type="button" data-start="sub" data-id="' + esc(x.id) + '">Practise</button>' : '<span></span>') + '</div>';
      }).join('') + '</div>';
    });
    $('#ms-list').innerHTML = h;
  }).catch(function (e) { $('#ms-list').innerHTML = '<p class="err">' + esc(API.msg(e)) + '</p>'; });
}
$('#ms-list').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-start]'); if (!b) return;
  S.scope = { subskill: b.getAttribute('data-id') }; openQuestion(null);
});
$('#home-list').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-start]'); if (!b) return;
  var k = b.getAttribute('data-start');
  S.scope = k === 'sub' ? { subskill: b.getAttribute('data-id') } : k === 'review' ? { review: true } : k === 'teacher' ? { teacher: b.getAttribute('data-sid') } : {};
  openQuestion(null);
});

/* ---------------- timing (SML #16): time to the FINAL answer + leaving the window, logged silently ---------------- */
var AWAY_MIN = 2000;
function tryStart() { S.shownAt = Date.now(); S.changedAt = 0; S.awayN = 0; S.awaySec = 0; S.awayFrom = 0; }
function changed() { S.changedAt = Date.now(); }
function awayStart() { if (S.cur && !S.busy && !S.awayFrom) S.awayFrom = Date.now(); }
function awayEnd() { if (!S.awayFrom) return; var d = Date.now() - S.awayFrom; S.awayFrom = 0; if (d >= AWAY_MIN) { S.awayN++; S.awaySec += Math.round(d / 1000); } }
document.addEventListener('visibilitychange', function () { if (document.hidden) awayStart(); else awayEnd(); });
window.addEventListener('blur', awayStart); window.addEventListener('focus', awayEnd);
function timing() {
  awayEnd();
  var now = Date.now(), sec = Math.round((now - S.shownAt) / 1000), ans = S.changedAt ? Math.round((S.changedAt - S.shownAt) / 1000) : sec;
  return { sec: sec, answer_sec: Math.min(sec, ans), away_n: S.awayN, away_sec: S.awaySec };
}

/* ---------------- one question ---------------- */
function openQuestion(after) {
  location.hash = 'q'; show('scr-q');
  $('#q-card').innerHTML = '<div class="spinner"></div>'; $('#q-sub').textContent = ''; $('#q-cnt').textContent = '';
  $('#q-ts').classList.toggle('hidden', !S.scope.teacher);
  toolsHost('q-work', '');
  var opts = {}; Object.keys(S.scope).forEach(function (k) { opts[k] = S.scope[k]; });
  if (after) opts.after = after; opts.device = deviceId();
  API.nextQuestion(S.code, opts).then(function (r) {
    if (!r.ok) { $('#q-card').innerHTML = '<p class="empty">' + esc(r.msg || 'No questions here yet.') + '</p><div class="actions"><button class="btn" type="button" data-go="home">Home</button>' + (r.done_all ? '<button class="btn ghost" type="button" data-go="skills">My skills</button>' : '') + '</div>'; return; }
    renderQuestion(r);
  }).catch(function (e) { $('#q-card').innerHTML = '<p class="err">' + esc(API.msg(e)) + '</p><div class="actions"><button class="btn" type="button" data-go="home">Home</button></div>'; });
}
function renderQuestion(r) {
  S.cur = r; S.sel = ''; S.busy = false; tryStart();
  S.spec = API.decodeKey(r.k, r.attempt_id + '|' + r.q.qid);
  $('#q-sub').textContent = r.subskill;
  $('#q-cnt').textContent = r.n_done ? r.n_done + ' done' : '';
  var q = r.q, h = '<div class="stem" id="q-stem">' + q.stem_html + '</div>';
  q.figures.forEach(function (f) { h += '<div class="fig"><img src="' + esc(f.src) + '" alt="' + esc(f.alt) + '"' + (f.width ? ' style="width:' + esc(f.width) + '"' : '') + '></div>'; });
  if (q.type === 'mcq') h += '<div class="choices" id="q-choices">' + q.choices.map(function (c) {
    return '<button type="button" class="ch" data-l="' + esc(c.label) + '"><span class="lt">' + esc(c.label) + '</span><span>' + c.html + '</span></button>'; }).join('') + '</div>';
  else h += '<div class="numrow"><input id="q-num" class="num" inputmode="decimal" autocomplete="off" aria-label="Your answer" placeholder="Answer">' +
            (q.unit ? '<span class="unit">' + esc(q.unit) + '</span>' : '') + '</div>';
  h += '<div class="prev" id="q-prev"></div>';
  h += '<div class="actions" id="q-actions"><button class="btn big" id="q-check" type="button">Check</button>' +
       (q.has_hint ? '<button class="btn ghost" id="q-hint" type="button">Hint</button>' : '') + '<span class="sync" id="q-sync"></span></div>';
  h += '<div id="q-hintbox"></div><div id="q-fb"></div>';
  $('#q-card').innerHTML = h;
  toolsHost('q-work', 'S:' + r.attempt_id);
  // resume: tries already made on this question
  (r.tries || []).forEach(function (t) { markTried(t.answer); });
  if (r.hint_used && r.hint_html) showHint(r.hint_html);
  if (r.tries && r.tries.length) $('#q-fb').innerHTML = '<div class="fb no">Not quite — ' + triesLeft(r.max_tries - r.tries.length) + '</div>';
  typeset($('#q-card'));
  var inp = $('#q-num'); if (inp) { inp.focus(); inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); }); inp.addEventListener('input', function () { changed(); typingSoon(); }); }
}
function triesLeft(n) { return n + (n === 1 ? ' try' : ' tries') + ' left'; }
function markTried(ans) {
  if (S.cur.q.type === 'mcq') { var b = $('.ch[data-l="' + String(ans).replace(/"/g, '') + '"]'); if (b) { b.classList.add('tried'); b.disabled = true; } }
  else $('#q-prev').innerHTML = 'Your answer: <s>' + esc(ans) + '</s>';
}
function showHint(html) { $('#q-hintbox').innerHTML = '<div class="hint"><span class="lab">Hint</span>' + html + '</div>'; var hb = $('#q-hint'); if (hb) hb.disabled = true; typeset($('#q-hintbox')); }
$('#q-card').addEventListener('click', function (ev) {
  var ch = ev.target.closest('.ch');
  if (ch && !ch.disabled && !S.busy) { $$('.ch').forEach(function (b) { b.classList.toggle('sel', b === ch); }); S.sel = ch.getAttribute('data-l'); changed(); typingSoon(); return; }
  if (ev.target.closest('#q-check')) { check(); return; }
  if (ev.target.closest('#q-hint')) { hint(); return; }
  if (ev.target.closest('#q-next')) { openQuestion(S.cur && S.cur.q.qid); return; }
});
function syncText(t) { var el = $('#q-sync'); if (el) el.textContent = t; }   // the student may already be on the next question
function tryCount() { return (S.cur.tries || []).length; }
function check() {
  if (S.busy || !S.cur) return;
  var q = S.cur.q, ans = q.type === 'mcq' ? S.sel : ($('#q-num').value || '').trim();
  if (!ans) { $('#q-fb').innerHTML = '<div class="fb no">' + (q.type === 'mcq' ? 'Choose an answer.' : 'Type your answer.') + '</div>'; return; }
  S.busy = true;
  var sec = timing(), ok = S.spec ? msbGrade_(S.spec, ans) : null, tryNo = tryCount() + 1, max = S.cur.max_tries;
  S.cur.tries = (S.cur.tries || []).concat([{ try_no: tryNo, answer: ans, correct: !!ok }]);
  if (ok !== null) feedback(ok, tryNo >= max, ans, null);           // instant: the server's own rule, in the browser
  syncText('Saving…');
  var aid = S.cur.attempt_id;
  API.submitTry(S.code, aid, ans, sec, ok).then(function (r) {
    if (!S.cur || S.cur.attempt_id !== aid) return;                  // already on the next question (saved anyway)
    if (!r.ok) { syncText(''); if (r.finished) finish(null); else { S.busy = false; S.cur.tries.pop(); $('#q-fb').innerHTML = '<div class="fb no">' + esc(r.msg || 'Not saved.') + '</div>'; } return; }
    syncText('Saved ✓');
    if (ok === null || r.mismatch) feedback(r.correct, r.finished, ans, r);   // the server is the judge
    else if (r.finished && !r.correct) feedback(false, true, ans, r);
    if (r.progress) showProgress(r.progress);
    tryStart();
  }).catch(function (e) {
    if (!S.cur || S.cur.attempt_id !== aid) return;
    S.cur.tries.pop(); S.busy = false;
    syncText('');
    $('#q-fb').innerHTML = '<div class="fb no">Not saved — ' + esc(API.msg(e)) + ' Press Check again.</div>';
  });
}
function answerHtml(r) {
  if (r && r.answer) return (r.answer.label ? '<b>' + esc(r.answer.label) + '</b> ' : '') + r.answer.html;
  var s = S.spec; if (!s) return '';
  if (s.t === 'mcq') { var c = S.cur.q.choices.filter(function (x) { return x.label === s.k[0]; })[0]; return '<b>' + esc(s.k[0]) + '</b> ' + (c ? c.html : ''); }
  return esc(s.k[0]) + (s.u ? (s.u === '°' ? '°' : ' ' + esc(s.u)) : '');
}
function feedback(ok, finished, ans, r) {
  var fb = $('#q-fb');
  if (ok) { fb.innerHTML = '<div class="fb ok"><span class="big">✓ Correct</span></div>'; markRight(); finish(r); return; }
  markTried(ans);
  if (!finished) {
    fb.innerHTML = '<div class="fb no"><span class="big">✗</span> Not quite — ' + triesLeft(S.cur.max_tries - tryCount()) + '</div>';
    S.busy = false; $$('.ch').forEach(function (b) { b.classList.remove('sel'); }); S.sel = '';
    var inp = $('#q-num'); if (inp) { inp.value = ''; inp.focus(); }
    return;
  }
  fb.innerHTML = '<div class="fb no"><span class="big">✗</span> Not this time.</div><div class="fb ans">Answer: ' + answerHtml(r) + '<br><span class="muted">Added to your review list.</span></div>';
  if (S.cur.q.type === 'mcq' && S.spec) { var rb = $('.ch[data-l="' + S.spec.k[0] + '"]'); if (rb) rb.classList.add('right'); }
  typeset(fb);
  finish(r);
}
function showProgress(p) {
  var el = $('#q-prog'); if (!el) { el = document.createElement('div'); el.id = 'q-prog'; $('#q-fb').appendChild(el); }
  el.className = 'prog' + (p.moved ? ' up' : '');
  el.innerHTML = (p.moved ? '<b>' + (p.solid ? 'Solid!' : 'Level up: ' + LVN[p.level]) + '</b> ' : '') + (p.solid ? '' : '<span class="muted">' + LVN[p.level] + ' · ' + half(p.steps) + ' of ' + p.need + '</span>');
}
function markRight() { if (S.cur.q.type === 'mcq') $$('.ch.sel').forEach(function (b) { b.classList.add('right'); }); }
function finish() {
  S.busy = true;
  $$('.ch').forEach(function (b) { b.disabled = true; });
  var inp = $('#q-num'); if (inp) inp.disabled = true;
  var a = $('#q-actions'), sync = $('#q-sync') ? $('#q-sync').textContent : '';
  if (!$('#q-next')) a.innerHTML = '<button class="btn big" id="q-next" type="button">Next question</button><button class="btn ghost" type="button" data-go="home">Home</button><span class="sync" id="q-sync">' + sync + '</span>';
}
function hint() {
  var b = $('#q-hint'); if (!b || b.disabled) return;
  b.disabled = true;
  API.useHint(S.code, S.cur.attempt_id).then(function (r) { if (r.ok) showHint(r.hint_html); else b.disabled = false; })
    .catch(function (e) { b.disabled = false; $('#q-fb').innerHTML = '<div class="fb no">' + esc(API.msg(e)) + '</div>'; });
}

/* ---------------- Practise with teacher (#9 v2): what is typed / chosen goes to the teacher's Live (read on Refresh) ---------------- */
function typedNow() { if (!S.cur) return ''; if (S.cur.q.type === 'mcq') return S.sel || ''; var i = $('#q-num'); return i ? i.value : ''; }
function typingSoon() {
  if (!S.scope.teacher || !S.cur) return;
  clearTimeout(S.typT); var aid = S.cur.attempt_id;
  S.typT = setTimeout(function () { if (S.cur && S.cur.attempt_id === aid) API.liveTyping(S.code, aid, typedNow()).catch(function () {}); }, 700);
}
/** The session result (lesson 10: ONE result view; Class session = this header + the same table; #8 reuses it). */
function resultTable(sm, teacher) {
  var h = '<div class="tscroll"><table class="tbl"><thead><tr>' + (teacher ? '<th>Student</th>' : '') + '<th class="r">Questions</th><th class="r">Right 1st try</th><th class="r">Tries</th><th class="r">Hints</th><th class="r">Messages</th><th class="r">Answer shown</th><th class="r">Steps</th></tr></thead><tbody>' +
    sm.students.map(function (s) { return '<tr>' + (teacher ? '<td>' + esc(s.name) + '</td>' : '') + '<td class="r">' + s.n + '</td><td class="r">' + s.right1 + '</td><td class="r">' + s.tries + '</td><td class="r">' + s.hints + '</td><td class="r">' + s.messages + '</td><td class="r">' + s.reveals + '</td><td class="r">' + half(s.steps) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  if (sm.questions && sm.questions.length) {
    var RT = { right_1: 'Right 1st try', right_2: 'Right later', wrong_2: 'Wrong', revealed: 'Answer shown', open: 'Not answered' };
    h += '<h2 class="h2">Questions</h2><div class="tscroll"><table class="tbl"><thead><tr>' + (teacher ? '<th>Student</th>' : '') + '<th>Question</th><th>Sub-skill</th><th>Result</th><th class="r">Tries</th><th>Hint</th><th class="r">Step</th></tr></thead><tbody>' +
      sm.questions.filter(function (q) { return teacher || true; }).map(function (q) {
        return '<tr>' + (teacher ? '<td>' + esc(q.student) + '</td>' : '') + '<td>' + esc(q.qid) + ' <span class="muted">' + esc(q.difficulty) + '</span></td><td>' + esc(q.subskill) + '</td><td><span class="res-' + esc(q.result) + '">' + esc(RT[q.result] || q.result) + '</span>' + (q.helped ? ' <span class="muted">helped</span>' : '') + '</td><td class="r">' + q.tries + '</td><td>' + (q.hint ? 'Yes' : '') + '</td><td class="r">' + half(q.step) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  return h;
}

/* ---------------- back button + reload ---------------- */
window.addEventListener('hashchange', function () {
  var h = location.hash.replace('#', '');
  if (h === 'home' && S.code && !$('#scr-home').classList.contains('on')) goHome();
  if (h === 'skills' && S.code && !$('#scr-skills').classList.contains('on')) openSkills();
  if (!h && (S.code || S.teacher)) logout();
});
(function resume() {
  var c = stored('msb_code');
  if (!c) return;
  API.login(c, deviceId(), true).then(function (r) { if (r.ok && r.student) { S.code = r.student.code; S.name = r.student.name; renderHome(r.home); } else store('msb_code', null); })
    .catch(function () {});
})();
</script>
