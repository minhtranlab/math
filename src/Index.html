<body>

  <!-- ============ Sign-in (students and teacher) ============ -->
  <section id="scr-login" class="screen on">
    <header class="top"><div class="wm"><i></i>Math Skill Bank</div></header>
    <div class="si">
      <i class="si-mark" aria-hidden="true"></i>
      <h1>Ready to practise?</h1>
      <form id="login-form" class="form" autocomplete="off">
        <input id="login-code" class="field" maxlength="24" placeholder="Your code" aria-label="Your code" autocapitalize="characters" spellcheck="false">
        <button class="btn big" id="login-btn" type="submit">Sign In</button>
      </form>
      <div class="err" id="login-err" role="alert"></div>
    </div>
  </section>

  <!-- ============ Student home ============ -->
  <section id="scr-home" class="screen">
    <header class="top"><button class="wm" data-go="home" type="button" title="Home"><i></i>Math Skill Bank</button>
      <div class="who"><span id="home-name"></span><button class="link" data-act="logout" type="button">Sign out</button></div></header>
    <main class="main">
      <p class="hello" id="home-hello"></p>
      <div id="home-list"><div class="spinner"></div></div>
    </main>
  </section>

  <!-- ============ My skills ============ -->
  <section id="scr-skills" class="screen">
    <header class="top"><button class="wm" data-go="home" type="button" title="Home"><i></i>Math Skill Bank</button>
      <div class="who"><button class="link" data-go="home" type="button">Home</button></div></header>
    <main class="main"><div id="ms-list"><div class="spinner"></div></div></main>
  </section>

  <!-- ============ One question ============ -->
  <section id="scr-q" class="screen">
    <header class="top"><button class="wm" data-go="home" type="button" title="Home"><i></i>Math Skill Bank</button>
      <div class="who"><button class="link" data-go="home" type="button">Home</button></div></header>
    <div class="qwrap">
      <div class="tsbar hidden" id="q-ts"><b>Practise with teacher</b></div>
      <div class="qhead"><p class="eyebrow" id="q-sub"></p><span class="cnt" id="q-cnt"></span></div>
      <div class="tools" data-host="q-work"><button type="button" class="tool" data-tool="pen">Pen</button><button type="button" class="tool" data-tool="calc">Calculator</button><button type="button" class="tool" data-tool="notes">Notes</button><button type="button" class="tool" data-tool="space">More space</button><button type="button" class="tool" data-tool="snap">Snapshot</button><button type="button" class="tool ask" data-ask="q">Ask teacher</button></div>
      <div class="askbox hidden" data-askbox="q"></div>
      <div class="work" id="q-work"><div class="qcard" id="q-card"><div class="spinner"></div></div><div class="spaces"></div></div>
    </div>
  </section>

  <!-- ============ Assignment set (#8): free navigation, autosave, Check Your Work → Submit ============ -->
  <section id="scr-set" class="screen">
    <header class="top"><button class="wm" data-go="home" type="button" title="Home"><i></i>Math Skill Bank</button>
      <div class="who"><span class="sync" id="set-sync"></span><button class="link" data-go="home" type="button">Home</button></div></header>
    <div class="qwrap">
      <div class="qhead"><p class="eyebrow" id="set-title"></p><span class="cnt" id="set-pos"></span></div>
      <div class="qnav" id="set-nav"></div>
      <div class="tools" data-host="set-work"><button type="button" class="tool" data-tool="pen">Pen</button><button type="button" class="tool" data-tool="calc">Calculator</button><button type="button" class="tool" data-tool="notes">Notes</button><button type="button" class="tool" data-tool="space">More space</button><button type="button" class="tool" data-tool="snap">Snapshot</button><button type="button" class="tool ask" data-ask="set">Ask teacher</button></div>
      <div class="askbox hidden" data-askbox="set"></div>
      <div class="work" id="set-work"><div class="qcard" id="set-card"></div><div class="spaces"></div></div>
      <div class="actions" id="set-actions"></div>
    </div>
  </section>

  <!-- ============ Fix wrong answers / Open (read-only review) (#8) ============ -->
  <section id="scr-fix" class="screen">
    <header class="top"><button class="wm" data-go="home" type="button" title="Home"><i></i>Math Skill Bank</button>
      <div class="who"><button class="link" id="fix-back" type="button">Result</button><button class="link" data-go="home" type="button">Home</button></div></header>
    <div class="qwrap">
      <div class="qhead"><p class="eyebrow" id="fix-title"></p><span class="cnt" id="fix-pos"></span></div>
      <div class="qnav" id="fix-nav"></div>
      <div class="tools" data-host="fix-work"><button type="button" class="tool" data-tool="pen">Pen</button><button type="button" class="tool" data-tool="calc">Calculator</button><button type="button" class="tool" data-tool="notes">Notes</button><button type="button" class="tool" data-tool="space">More space</button><button type="button" class="tool" data-tool="snap">Snapshot</button><button type="button" class="tool ask" data-ask="fix">Ask teacher</button></div>
      <div class="askbox hidden" data-askbox="fix"></div>
      <div class="work" id="fix-work"><div class="qcard" id="fix-card"></div><div class="spaces"></div></div>
    </div>
  </section>

  <!-- ============ Result · My history (#8; ONE result view, lesson 10) ============ -->
  <section id="scr-hw" class="screen">
    <header class="top"><button class="wm" data-go="home" type="button" title="Home"><i></i>Math Skill Bank</button>
      <div class="who"><button class="link" data-hw="history" type="button">My history</button><button class="link" data-go="home" type="button">Home</button></div></header>
    <main class="main" id="hw-main"><div class="spinner"></div></main>
  </section>

  <!-- ============ Teacher: Go over one question (#8; SML go-over tools) ============ -->
  <section id="scr-go" class="screen">
    <header class="top"><button class="wm" data-go="teacher" type="button" title="Back"><i></i>Math Skill Bank</button>
      <div class="who"><button class="btn ghost small" id="go-prev" type="button">‹ Prev</button><span id="go-pos"></span><button class="btn ghost small" id="go-next" type="button">Next ›</button><button class="link" id="go-back" type="button">List</button></div></header>
    <div class="qwrap">
      <div class="tsbar" id="go-info"></div>
      <div class="qhead"><p class="eyebrow" id="go-sub"></p><span class="cnt" id="go-qid"></span></div>
      <div class="tools" data-host="go-work"><button type="button" class="tool" data-tool="pen">Pen</button><button type="button" class="tool" data-tool="calc">Calculator</button><button type="button" class="tool" data-tool="notes">Notes</button><button type="button" class="tool" data-tool="space">More space</button><button type="button" class="tool" data-tool="snap">Snapshot</button><button type="button" class="tool" id="go-ans">Show answer</button></div>
      <div class="work" id="go-work"><div class="qcard" id="go-card"></div><div class="spaces"></div></div>
      <div id="go-students"></div>
    </div>
  </section>

  <!-- ============ Teacher: Live — the student's question on my screen (Practise with teacher) ============ -->
  <section id="scr-tq" class="screen">
    <header class="top"><button class="wm" data-go="teacher" type="button" title="Back"><i></i>Math Skill Bank</button>
      <div class="who"><span id="tq-who"></span><button class="btn small" id="tq-refresh" type="button">Refresh</button><button class="link" id="tq-close" type="button">Close</button></div></header>
    <div class="qwrap">
      <div class="tsbar" id="tq-info"></div>
      <div class="qhead"><p class="eyebrow" id="tq-sub"></p><span class="cnt" id="tq-qid"></span></div>
      <div class="tools" data-host="tq-work"><button type="button" class="tool" data-tool="pen">Pen</button><button type="button" class="tool" data-tool="calc">Calculator</button><button type="button" class="tool" data-tool="notes">Notes</button><button type="button" class="tool" data-tool="space">More space</button>
        <button type="button" class="tool" id="tq-ans">Show answer</button><button type="button" class="tool" id="tq-next">Assign next</button><button type="button" class="tool" id="tq-snap" data-tool="snap">Snapshot</button></div>
      <div class="nxpanel hidden" id="tq-nextpanel"></div>
      <div class="work" id="tq-work"><div class="qcard" id="tq-card"></div><div class="spaces"></div></div>
    </div>
  </section>

  <!-- ============ shared tools: pen bar, calculator, notes, snapshot ============ -->
  <div class="penbar" id="pen-bar" hidden>
    <button type="button" data-pc="blue" class="pc" style="--c:#1f5fd6" aria-label="Blue"></button><button type="button" data-pc="red" class="pc" style="--c:#d0263c" aria-label="Red"></button>
    <button type="button" data-pc="green" class="pc" style="--c:#1f8a4c" aria-label="Green"></button><button type="button" data-pc="yellow" class="pc" style="--c:#f5c400" aria-label="Highlighter"></button>
    <button type="button" data-pw="1">Thin</button><button type="button" data-pw="2">Thick</button><button type="button" data-pt="eraser">Eraser</button>
    <button type="button" data-pt="undo">Undo</button><button type="button" data-pt="clear">Clear</button><button type="button" data-pt="finger" aria-pressed="false">✋ Finger draws</button><button type="button" data-pt="off">Done</button>
  </div>
  <div class="float hidden" id="calc-panel"><div class="fhead" data-drag="calc-panel"><b>Calculator</b><button type="button" class="mini on" id="calc-g">Graphing</button><button type="button" class="mini" id="calc-s">Scientific</button><button type="button" class="link" data-close="calc">Close</button></div>
    <div class="fbody"><p class="muted" id="calc-msg"></p><div id="calc-graph" class="calcbox"></div><div id="calc-sci" class="calcbox hidden"></div></div></div>
  <div class="float hidden" id="notes-panel"><div class="fhead" data-drag="notes-panel"><b>Notes</b><button type="button" class="mini" id="notes-math">+ Math</button><button type="button" class="mini" id="notes-text">+ Text</button><button type="button" class="mini" id="notes-clear">Clear</button><button type="button" class="link" data-close="notes">Close</button></div>
    <div class="fbody"><div id="notes-lines" class="nlines"></div><p class="muted" id="notes-msg"></p></div></div>
  <div class="snapcover hidden" id="snap"><div class="snapbox"><div class="tbar"><b>Snapshot</b><a class="btn small" id="snap-dl" download="question.png">Download</a><button type="button" class="btn ghost small" id="snap-share">Share</button><button type="button" class="link" id="snap-close">Close</button></div>
    <p class="muted">iPad: press and hold the picture → Save to Photos / Copy / Share.</p><img id="snap-img" alt="Snapshot of the question"></div></div>

  <!-- ============ Teacher ============ -->
  <section id="scr-teacher" class="screen">
    <header class="top"><button class="wm" data-go="teacher" type="button" title="Home"><i></i>Math Skill Bank</button>
      <div class="who"><span>Teacher</span><button class="link" data-act="logout" type="button">Sign out</button></div></header>
    <main class="main" id="t-main"><div class="spinner"></div></main>
  </section>

  <?!= include('Pen'); ?>
  <?!= include('Tools'); ?>
  <?!= include('TeacherPage'); ?>
  <?!= include('WithTeacher'); ?>
  <?!= include('HomeworkPage'); ?>
